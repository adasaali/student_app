    This is a placeholder for base href that will be replaced by the value of

  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="بوابة الطالب - مدرسة الأكاديمية الخاصة">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="الأكاديمية">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

<body>
  <!-- شاشة التحميل: تظهر فوراً وتختفي لما يجهز التطبيق -->
  <div id="app-loading-screen" style="
      position:fixed; inset:0; z-index:10000; background:#16213E;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:-apple-system,sans-serif;">
    <img src="icons/Icon-192.png" style="width:80px; height:80px; border-radius:18px; margin-bottom:20px;">
    <div style="
        width:36px; height:36px; border:3px solid rgba(255,255,255,.25);
        border-top-color:#D4AF37; border-radius:50%;
        animation:app-spin 0.8s linear infinite;"></div>
    <div style="color:#fff; font-size:14px; margin-top:16px; direction:rtl;">جاري تحميل التطبيق…</div>
  </div>
  <style>
    @keyframes app-spin { to { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading-screen');
      if (el) {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 300);
      }
    });
  </script>
