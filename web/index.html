<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="بوابة الطالب - مدرسة الأكاديمية الخاصة">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="الأكاديمية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>مدرسة الأكاديمية الخاصة</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- بانر إرشادي لمستخدمي iPhone/Safari لإضافة التطبيق للشاشة الرئيسية -->
  <div id="ios-install-banner" style="
      display:none; position:fixed; left:0; right:0; bottom:0; z-index:9999;
      background:#16213E; color:#fff; padding:16px 20px; direction:rtl;
      font-family:-apple-system,sans-serif; box-shadow:0 -2px 12px rgba(0,0,0,.25);
      align-items:center; gap:12px;">
    <div style="flex:1; font-size:14px; line-height:1.6;">
      <strong>لتثبيت تطبيق المدرسة على شاشتك الرئيسية:</strong><br>
      اضغطي على زر المشاركة
      <span style="display:inline-block; width:18px; height:18px; vertical-align:middle;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M5 14v5a2 2 0 002 2h10a2 2 0 002-2v-5"/></svg>
      </span>
      أسفل الشاشة، وبعدين اختاري "إضافة إلى الشاشة الرئيسية".
    </div>
    <button onclick="document.getElementById('ios-install-banner').style.display='none'" style="
        background:transparent; border:1px solid #fff; color:#fff; border-radius:8px;
        padding:6px 12px; font-size:13px; white-space:nowrap;">فهمت</button>
  </div>

  <script>
    (function () {
      var isIos = /iphone|ipad|ipod/i.test(window.navigator.userAgent);
      var isSafari = /^((?!chrome|android|crios|fxios).)*safari/i.test(window.navigator.userAgent);
      var isStandalone = window.navigator.standalone === true;
      var dismissed = localStorage.getItem('ios_install_banner_dismissed');
      if (isIos && isSafari && !isStandalone && !dismissed) {
        setTimeout(function () {
          document.getElementById('ios-install-banner').style.display = 'flex';
        }, 1500);
      }
      var btn = document.querySelector('#ios-install-banner button');
      if (btn) {
        btn.addEventListener('click', function () {
          localStorage.setItem('ios_install_banner_dismissed', '1');
        });
      }
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
