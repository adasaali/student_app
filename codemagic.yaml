workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.academyschool.student
      vars:
        APP_STORE_APPLE_ID: 6809953696
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -maxdepth 2 -type f | while read -r podfile; do
            pod install --project-directory="$(dirname "$podfile")"
          done
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Flutter build ipa
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          echo "Using build number: $BUILD_NUMBER"
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  web-workflow:
    name: Web (PWA) Workflow
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build web
        script: |
          flutter build web --release --pwa-strategy=offline-first
      - name: Force local CanvasKit (avoid Google CDN, blocked/slow in some regions)
        script: |
          python3 - << 'PYEOF'
          path = "build/web/flutter_bootstrap.js"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          old = '_flutter.loader.load({\n  serviceWorkerSettings: {'
          new = '_flutter.loader.load({\n  config: { canvasKitBaseUrl: "canvaskit/" },\n  serviceWorkerSettings: {'
          if old in content:
              content = content.replace(old, new, 1)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("تم تفعيل canvaskit المحلي بنجاح")
          else:
              print("تحذير: لم يتم العثور على النمط المتوقع بملف flutter_bootstrap.js")
          PYEOF
      - name: Zip web build
        script: |
          cd build/web && zip -r ../../student_app_web.zip . && cd ../..
    artifacts:
      - student_app_web.zip
      - build/web/**