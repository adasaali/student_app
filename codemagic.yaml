  web-workflow:
    name: Web (PWA) Workflow
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter build web
        script: |
          flutter build web --release --pwa-strategy=offline-first
      - name: Zip web build
        script: |
          cd build/web && zip -r ../../student_app_web.zip . && cd ../..
    artifacts:
      - student_app_web.zip
      - build/web/**
