name: student_app
description: تطبيق الطالب المتكامل
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State & Network
  provider: ^6.1.1
  http: ^1.2.0
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  flutter_secure_storage_web: ^1.2.1
  path_provider: ^2.1.2

  # UI & Fonts
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1

  # Connectivity
  connectivity_plus: ^6.1.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3

  # Notifications
  flutter_local_notifications: ^22.2.0

  # Files & Launchers
  url_launcher: ^6.3.2
  flutter_pdfview: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - shorebird.yaml